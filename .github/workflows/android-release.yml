# Builds a signed release APK + AAB on every push to main, and on manual
# dispatch. No local Android toolchain or AIDE required — GitHub's runners do
# the work and publish the artifacts.
#
# Signing: set these repository secrets (Settings → Secrets and variables →
# Actions). If they are absent the build still runs, but the release artifacts
# are UNSIGNED (still useful for verification, not for Play upload).
#   KEYSTORE_BASE64    base64 of your upload .jks  (base64 -w0 keystore.jks)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password
name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK/AAB to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify bundled Xray AAR checksum
        run: |
          expected=$(awk '{print $1}' .aar.sha256)
          actual=$(sha256sum app/libs/libv2ray.aar | awk '{print $1}')
          echo "expected=$expected"
          echo "actual  =$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::libv2ray.aar checksum mismatch — refusing to build."
            exit 1
          fi

      # Secrets cannot be referenced in a step-level `if:` — do the presence
      # check in shell and publish the path through $GITHUB_ENV instead.
      - name: Decode signing keystore (if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing keystore decoded."
          else
            echo "No KEYSTORE_BASE64 secret set — release artifacts will be UNSIGNED."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Create / update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AiV2RayClient build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
